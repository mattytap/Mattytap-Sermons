# Deploy the plugin to WordPress.org SVN (trunk + tags/<version> + assets).
#
# Manual-trigger only for now: the SVN slot does not exist until the
# WordPress.org review approves the plugin, and the SVN_USERNAME /
# SVN_PASSWORD repository secrets are not set until then. Run this from
# the Actions tab against main (the version ships from readme.txt's Stable
# tag, not the git ref, so any ref carrying the intended release works).
# First run should keep dry_run = true and the log inspected before
# re-running with dry_run = false.
#
# Once the slot is live and the first deploy has succeeded, this can be
# switched to fire automatically on published releases by adding:
#
#   release:
#     types: [published]
#
# under `on:` (non-prerelease releases only are deployed by convention;
# guard with `if: ${{ !github.event.release.prerelease }}` on the job).
#
# Packaging exclusions live in .distignore (mirrors the allow-list in
# bin/build-release-zip.ps1). Listing assets (banner/icon/screenshots)
# deploy from .wordpress-org/ to the SVN assets/ directory.

name: Deploy to WordPress.org SVN

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build and diff, do not commit to SVN)"
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Derive the release version from readme.txt's Stable tag rather than
      # the git ref. A manual workflow_dispatch against a branch leaves
      # GITHUB_REF as refs/heads/main, which the deploy action would try to
      # use verbatim as the SVN tag name. Reading the Stable tag makes the
      # workflow runnable from any ref and keeps the SVN tag in lockstep
      # with the version the plugin actually declares.
      - name: Determine plugin version
        id: ver
        run: |
          VERSION="$(grep -i '^Stable tag:' readme.txt | head -1 | sed -E 's/.*:[[:space:]]*//' | tr -d '[:space:]\r')"
          if [ -z "$VERSION" ]; then echo "Could not read Stable tag from readme.txt" >&2; exit 1; fi
          echo "Detected version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: WordPress.org plugin deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ inputs.dry_run }}
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: mattytap-sermons
          VERSION: ${{ steps.ver.outputs.version }}
          ASSETS_DIR: .wordpress-org

      # Guard against the 3.1.2 regression: an unanchored `vendor` entry in
      # .distignore stripped the bundled runtime libraries (includes/vendor:
      # CMB2 + wp-background-processing; assets/vendor: Plyr) from the SVN
      # payload, white-screening every install. The deploy action builds the
      # package zip even on a dry run, so this inspects the real payload and
      # fails before a live commit can ship a broken package.
      - name: Verify bundled runtime libraries are packaged
        run: |
          ZIP="${{ steps.deploy.outputs.zip-path }}"
          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "Could not find the generated package zip at '$ZIP'." >&2
            exit 1
          fi
          required="includes/vendor/CMB2/init.php includes/vendor/wp-background-process.php includes/vendor/wp-async-request.php assets/vendor/js/plyr.polyfilled.min.js"
          list="$(unzip -Z1 "$ZIP")"
          missing=0
          for f in $required; do
            if ! printf '%s\n' "$list" | grep -qF -- "$f"; then
              echo "MISSING from package: $f" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Deploy package is missing bundled runtime libraries; failing the job." >&2
            exit 1
          fi
          echo "All bundled runtime libraries present in the deploy package."
